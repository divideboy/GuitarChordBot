app = "guitarchordbot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

[deploy]
  strategy = "immediate"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  count = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[restart]]
  policy = "always"        # auto-restart if it crashes
  max_retries = 10